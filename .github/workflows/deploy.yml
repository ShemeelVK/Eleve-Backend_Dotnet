name: Deploy .NET 8 API to EC2

on:
  push:
    branches: ["master"] # Triggers when you push to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Publish App
      run: dotnet publish -c Release -o ./publish

    - name: Inject Secret AppSettings
      env:
        APPSETTINGS: ${{ secrets.APPSETTINGS_JSON }}
      run: |
        echo "$APPSETTINGS" > ./publish/appsettings.json

    - name: Copy Files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: "publish/*"
        target: "/var/www/eleve-backend"
        strip_components: 1

    - name: Restart API Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo systemctl restart eleve-api